    <!-- Pre-React boot loader: pure CSS, renders instantly before any JS
         executes/parses, so the first paint is never a blank page. React's
         createRoot(...).render() replaces #root's contents entirely on its
         first render, so this markup disappears automatically the instant
         the app is ready -- no cleanup JS needed. -->
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(ellipse 70% 50% at 50% 40%, rgba(34, 211, 238, 0.08), transparent 65%), #05070a;
      }
      #boot-loader .ring-wrap {
        position: relative;
        width: 92px;
        height: 92px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot-loader .glow {
        position: absolute;
        inset: -20px;
        border-radius: 999px;
        background: radial-gradient(circle, rgba(34, 211, 238, 0.35), transparent 70%);
        filter: blur(10px);
        animation: boot-pulse 2.2s ease-in-out infinite;
      }
      #boot-loader .ring {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        border: 2.5px solid transparent;
        border-top-color: #22d3ee;
        border-right-color: #3b82f6;
        animation: boot-spin 1.1s linear infinite;
      }
      #boot-loader .ring.slow {
        inset: 10px;
        border-top-color: transparent;
        border-right-color: transparent;
        border-bottom-color: rgba(34, 211, 238, 0.55);
        border-left-color: rgba(59, 130, 246, 0.4);
        animation: boot-spin-rev 1.8s linear infinite;
      }
      #boot-loader img {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        position: relative;
        z-index: 1;
        animation: boot-float 2.6s ease-in-out infinite;
      }
      #boot-loader .brand {
        font-family: Inter, system-ui, sans-serif;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: 0.02em;
        background: linear-gradient(90deg, #e2e8f0, #22d3ee, #3b82f6);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      #boot-loader .sub {
        font-family: Inter, system-ui, sans-serif;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #64748b;
      }
      #boot-loader .dots span {
        display: inline-block;
        width: 4px;
        height: 4px;
        margin: 0 2px;
        border-radius: 999px;
        background: #22d3ee;
        animation: boot-dots 1.2s ease-in-out infinite;
      }
      #boot-loader .dots span:nth-child(2) { animation-delay: 0.15s; }
      #boot-loader .dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-spin-rev { to { transform: rotate(-360deg); } }
      @keyframes boot-pulse {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.12); }
      }
      @keyframes boot-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes boot-dots {
        0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
        40% { opacity: 1; transform: scale(1.1); }
      }
    </style>
  </head>
  <body class="bg-base-950">

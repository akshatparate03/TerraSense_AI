# This file lives inside frontend/ because the repo root is kept clean
# (only backend/, frontend/, README.md, .gitignore). In Netlify's site
# settings, set "Base directory" to "frontend" so Netlify finds this file
# and runs all commands/paths below relative to this folder.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Environment variables to set in the Netlify dashboard (Site settings ->
# Environment variables) -- do NOT commit real values here:
#   VITE_API_BASE_URL      = https://terrasenseai-backend.onrender.com/api
#   VITE_WS_BASE_URL        = wss://terrasenseai-backend.onrender.com/ws/monitoring
#   VITE_GOOGLE_CLIENT_ID   = <your Google OAuth Web client ID>
